<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>환율 AI 비서</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>💱 환율 AI 비서</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="chat">채팅</button>
      <button class="tab-btn" data-tab="data">데이터 관리</button>
      <button class="tab-btn" data-tab="history">대화 기록</button>
    </nav>
  </header>

  <main>
    <!-- 채팅 탭 -->
    <section id="chat" class="tab-panel active">
      <div id="summary-box" class="summary-box">요약 정보를 불러오는 중...</div>
      <div id="chat-messages" class="chat-messages"></div>
      <div id="chat-loading" class="loading hidden">AI가 답변을 준비 중입니다...</div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="예: 요즘 환율 어때?" autocomplete="off" required />
        <button type="submit">전송</button>
      </form>
    </section>

    <!-- 데이터 관리 탭 -->
    <section id="data" class="tab-panel">
      <form id="data-form" class="data-form">
        <input id="data-date" type="date" required />
        <input id="data-value" type="number" step="0.01" placeholder="환율 값" required />
        <input id="data-memo" type="text" placeholder="메모(선택)" />
        <button type="submit">추가</button>
      </form>
      <table id="data-table">
        <thead>
          <tr><th>날짜</th><th>값</th><th>메모</th><th>삭제</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 대화 기록 탭 -->
    <section id="history" class="tab-panel">
      <ul id="conversation-list"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
